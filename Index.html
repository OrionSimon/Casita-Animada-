<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casita Académica Interactiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 50%, #f3e8ff 100%); }
        .roof-triangle { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
        .room-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .room-card:hover { transform: translateY(-4px) scale(1.02); }
    </style>
</head>
<body class="min-h-full flex flex-col items-center justify-start p-3 sm:p-6 lg:p-8">
    
    <!-- CONTENEDOR PRINCIPAL EN FORMA DE CASA -->
    <div class="w-full max-w-md sm:max-w-xl bg-white rounded-b-[2.5rem] shadow-2xl border-4 border-pink-300 overflow-hidden flex flex-col my-auto relative">
        
        <!-- TEJADO SUPERIOR CON TÍTULO -->
        <div class="relative w-full pt-16 sm:pt-20 pb-4 bg-gradient-to-b from-pink-100 to-pink-200 border-b-4 border-pink-300 flex flex-col items-center justify-end px-4 text-center">
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-full h-16 sm:h-20 bg-pink-300 roof-triangle shadow-sm"></div>
            <h1 class="relative z-10 text-xs sm:text-base font-bold text-purple-950 tracking-tight uppercase px-3 py-1 bg-white/80 rounded-full shadow-sm mt-2">
                Conócete · Elige · Construye tu vida
            </h1>
        </div>

        <!-- CUADRÍCULA DE 8 HABITACIONES (TARJETAS) -->
        <main class="p-4 sm:p-6 bg-white grid grid-cols-2 gap-3 sm:gap-4">
            
            <!-- 1. PERSONA -->
            <button onclick="openModal('persona')" class="room-card group bg-pink-100/70 border-2 border-pink-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">👤</div>
                <h2 class="text-sm sm:text-base font-extrabold text-purple-950">Persona</h2>
                <p class="text-[11px] sm:text-xs text-purple-800/80 font-medium mt-0.5">Intimidad y notas</p>
            </button>

            <!-- 2. LIBERTAD -->
            <button onclick="openModal('libertad')" class="room-card group bg-blue-100/70 border-2 border-blue-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🕊️</div>
                <h2 class="text-sm sm:text-base font-extrabold text-blue-950">Libertad</h2>
                <p class="text-[11px] sm:text-xs text-blue-800/80 font-medium mt-0.5">Planos y arbitrio</p>
            </button>

            <!-- 3. IDENTIDAD -->
            <button onclick="openModal('identidad')" class="room-card group bg-purple-100/70 border-2 border-purple-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🪞</div>
                <h2 class="text-sm sm:text-base font-extrabold text-purple-950">Identidad</h2>
                <p class="text-[11px] sm:text-xs text-purple-800/80 font-medium mt-0.5">Reconocimiento</p>
            </button>

            <!-- 4. AUTOESTIMA -->
            <button onclick="openModal('autoestima')" class="room-card group bg-yellow-100/70 border-2 border-yellow-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">💎</div>
                <h2 class="text-sm sm:text-base font-extrabold text-yellow-950">Autoestima</h2>
                <p class="text-[11px] sm:text-xs text-yellow-800/80 font-medium mt-0.5">Competencia y valor</p>
            </button>

            <!-- 5. PERSONALIDAD -->
            <button onclick="openModal('personalidad')" class="room-card group bg-emerald-100/70 border-2 border-emerald-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🧩</div>
                <h2 class="text-sm sm:text-base font-extrabold text-emerald-950">Personalidad</h2>
                <p class="text-[11px] sm:text-xs text-emerald-800/80 font-medium mt-0.5">Carácter y rasgos</p>
            </button>

            <!-- 6. FAMILIA -->
            <button onclick="openModal('familia')" class="room-card group bg-orange-100/70 border-2 border-orange-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🏡</div>
                <h2 class="text-sm sm:text-base font-extrabold text-orange-950">Familia</h2>
                <p class="text-[11px] sm:text-xs text-orange-800/80 font-medium mt-0.5">Ámbito del amor</p>
            </button>

            <!-- 7. AMISTAD -->
            <button onclick="openModal('amistad')" class="room-card group bg-rose-100/70 border-2 border-rose-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🤝</div>
                <h2 class="text-sm sm:text-base font-extrabold text-rose-950">Amistad</h2>
                <p class="text-[11px] sm:text-xs text-rose-800/80 font-medium mt-0.5">Pilares y polillas</p>
            </button>

            <!-- 8. REDES SOCIALES -->
            <button onclick="openModal('redes')" class="room-card group bg-indigo-100/70 border-2 border-indigo-300 rounded-3xl p-4 sm:p-5 shadow-sm hover:shadow-lg flex flex-col items-center text-center cursor-pointer">
                <div class="text-3xl sm:text-4xl mb-2 filter drop-shadow">🌐</div>
                <h2 class="text-sm sm:text-base font-extrabold text-indigo-950">Redes Sociales</h2>
                <p class="text-[11px] sm:text-xs text-indigo-800/80 font-medium mt-0.5">Uso responsable</p>
            </button>

        </main>
        
        <footer class="bg-gray-50 py-3 text-center text-[10px] text-gray-500 border-t border-gray-100 font-medium">
            Casita Académica Interactiva • Antropología y Desarrollo
        </footer>
    </div>

    <!-- VENTANA EMERGENTE (MODAL) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-container" class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col max-h-[90vh] border-4 border-pink-200">
            
            <!-- CABECERA MODAL -->
            <div id="modal-header" class="bg-pink-50 p-4 sm:p-5 flex items-center justify-between border-b-2 border-pink-100">
                <div class="flex items-center space-x-3">
                    <span id="modal-icon" class="text-3xl">👤</span>
                    <div>
                        <span id="modal-badge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-pink-200 text-pink-900">Tema</span>
                        <h3 id="modal-title" class="text-lg sm:text-xl font-bold text-gray-900 mt-0.5">Título</h3>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-white hover:bg-pink-600 hover:text-white text-gray-800 flex items-center justify-center font-bold text-base shadow transition cursor-pointer">✕</button>
            </div>

            <!-- CUERPO CONTENIDO MODAL -->
            <div class="p-4 sm:p-6 overflow-y-auto space-y-5 flex-1">
                <div class="w-full h-40 sm:h-48 rounded-2xl overflow-hidden shadow-sm relative">
                    <img id="modal-hero-img" src="" alt="Ilustración" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-3">
                        <p id="modal-hero-caption" class="text-white text-xs font-medium drop-shadow">Contenido Verificado</p>
                    </div>
                </div>

                <div id="modal-content" class="space-y-3 text-gray-700 text-xs sm:text-sm leading-relaxed"></div>

                <!-- BLOQUE DE RETO INTERACTIVO -->
                <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 sm:p-5 shadow-inner mt-4">
                    <div class="flex items-center space-x-2 mb-2">
                        <span class="text-xl">🎮</span>
                        <h4 class="font-bold text-amber-950 text-sm sm:text-base">Reto de Comprensión</h4>
                    </div>
                    <p id="reto-pregunta" class="text-xs sm:text-sm text-amber-900 font-medium mb-3"></p>
                    <div id="reto-opciones" class="space-y-2"></div>
                    <div id="reto-feedback" class="mt-3 hidden p-3 rounded-xl text-xs sm:text-sm font-medium transition-all"></div>
                </div>
            </div>

            <!-- PIE DE MODAL -->
            <div class="bg-gray-50 px-5 py-3 border-t border-gray-200 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs sm:text-sm font-semibold rounded-xl shadow transition cursor-pointer">Regresar a la Casita 🏠</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE INTERACTIVIDAD Y DATOS -->
    <script>
        const db = {
            persona: {
                badge: "Tema 1 • Persona", icon: "👤", title: "La Persona y su Núcleo",
                img: "https://images.unsplash.com/photo-1544717305-2782549b5136?w=800&auto=format&fit=crop&q=80", caption: "Intimidad, manifestación y diálogo.",
                content: `<p class="font-medium text-purple-950">Basado en Ricardo Yepes y Javier Aranguren:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Intimidad:</strong> Santuario interior protegido por el pudor. Es dinámico y creativo; del mundo interior brotan planes, invenciones y novedades inéditas.</li><li><strong>Manifestación:</strong> La persona expresa su intimidad exteriormente mediante el cuerpo (el rostro y la mirada), los gestos, la acción y la palabra.</li><li><strong>Diálogo:</strong> El ser humano es constitutivamente social y dialógico; necesitamos el encuentro con el 'tú' para alcanzar nuestra identidad.</li><li><strong>El dar:</strong> La persona se realiza plenamente no en solitario, sino entregando y aceptando en reciprocidad.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#e9d5ff55;border:2px solid #a855f766"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="67" cy="42" r="28" fill="#e9d5ff" stroke="#a855f7" stroke-width="2.5"/><text x="67" y="52" font-size="26" text-anchor="middle">💭</text><text x="67" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Intimidad</text><text x="67" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">mundo interior</text><text x="133" y="50" font-size="22" font-weight="800" fill="#a855f7" text-anchor="middle">→</text><circle cx="200" cy="42" r="28" fill="#e9d5ff" stroke="#a855f7" stroke-width="2.5"/><text x="200" y="52" font-size="26" text-anchor="middle">🗣️</text><text x="200" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Manifestación</text><text x="200" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">rostro, gesto, palabra</text><text x="267" y="50" font-size="22" font-weight="800" fill="#a855f7" text-anchor="middle">→</text><circle cx="333" cy="42" r="28" fill="#e9d5ff" stroke="#a855f7" stroke-width="2.5"/><text x="333" y="52" font-size="26" text-anchor="middle">🤝</text><text x="333" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Diálogo</text><text x="333" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">encuentro con el tú</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">De la intimidad al encuentro con los demás</p></div></div>`,
                reto: { pregunta: "¿Por qué se afirma que la intimidad tiene capacidad creativa?", opciones: [{ texto: "Porque es un espacio cerrado donde se guardan cosas sin que nadie las vea jamás.", correcta: false }, { texto: "Porque de un mundo interior abierto al autoconocimiento brotan planes, invenciones y novedades.", correcta: true }] }
            },
            libertad: {
                badge: "Tema 2 • Libertad", icon: "🕊️", title: "Los Planos de la Libertad",
                img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800&auto=format&fit=crop&q=80", caption: "Libertad constitutiva, arbitrio y virtudes.",
                content: `<p class="font-medium text-blue-950">Basado en Ricardo Yepes Stork:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Libertad constitutiva:</strong> Somos libres en lo profundo; es un espacio interior inviolable que ninguna coacción externa puede destruir por completo.</li><li><strong>Libertad de arbitrio:</strong> Capacidad de autodeterminación para elegir. El deseo inteligente se convierte en una razón para actuar, superando el mero impulso ciego.</li><li><strong>Crecimiento y Virtud:</strong> Las elecciones repetidas generan hábitos. La virtud es la fuerza (vis) que fortalece la voluntad para aspirar a metas altas.</li><li><strong>Proyecto vital:</strong> Vivir es forjar una biografía orientada por ideales significativos.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#dbeafe55;border:2px solid #3b82f666"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="50" cy="42" r="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="50" y="52" font-size="26" text-anchor="middle">🕊️</text><text x="50" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Constitutiva</text><text x="50" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">interior inviolable</text><text x="100" y="50" font-size="22" font-weight="800" fill="#3b82f6" text-anchor="middle">→</text><circle cx="150" cy="42" r="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="150" y="52" font-size="26" text-anchor="middle">⚖️</text><text x="150" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Arbitrio</text><text x="150" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">elegir</text><text x="200" y="50" font-size="22" font-weight="800" fill="#3b82f6" text-anchor="middle">→</text><circle cx="250" cy="42" r="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="250" y="52" font-size="26" text-anchor="middle">🌱</text><text x="250" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Virtud</text><text x="250" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">hábitos</text><text x="300" y="50" font-size="22" font-weight="800" fill="#3b82f6" text-anchor="middle">→</text><circle cx="350" cy="42" r="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="350" y="52" font-size="26" text-anchor="middle">🧭</text><text x="350" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Proyecto vital</text><text x="350" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">biografía</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">Los planos de la libertad, de lo profundo al proyecto de vida</p></div></div>`,
                reto: { pregunta: "¿Qué diferencia al deseo inteligente del simple impulso?", opciones: [{ texto: "El deseo inteligente integra el impulso dentro de proyectos valiosos y razonados.", correcta: true }, { texto: "El impulso sensible es siempre sinónimo de libertad absoluta.", correcta: false }] }
            },
            identidad: {
                badge: "Tema 3 • Identidad", icon: "🪞", title: "Identidad y Autenticidad",
                img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop&q=80", caption: "Reconocimiento dialógico y biografía.",
                content: `<p class="font-medium text-purple-950">Basado en Ricardo Yepes:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Reconocimiento:</strong> Nuestra identidad se conforma a través de la mirada y aceptación de los demás; una imagen social disminuida genera baja autoestima e inautenticidad.</li><li><strong>Refrendo personal:</strong> La autenticidad exige que nuestras acciones estén asistidas y respaldadas por el fondo insobornable de la intimidad personal.</li><li><strong>Dimensión biográfica:</strong> La vida es un sistema temporal; ser fiel a uno mismo anuda la memoria del pasado con el presente y el futuro.</li><li><strong>Vocación:</strong> El proyecto globalizador y el 'para qué' que otorga unidad y unicidad a nuestra biografía.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#f3e8ff55;border:2px solid #9333ea66"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="67" cy="42" r="28" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/><text x="67" y="52" font-size="26" text-anchor="middle">🪞</text><text x="67" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Reconocimiento</text><text x="67" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">la mirada del otro</text><text x="133" y="50" font-size="22" font-weight="800" fill="#9333ea" text-anchor="middle">→</text><circle cx="200" cy="42" r="28" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/><text x="200" y="52" font-size="26" text-anchor="middle">✍️</text><text x="200" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Refrendo</text><text x="200" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">acciones auténticas</text><text x="267" y="50" font-size="22" font-weight="800" fill="#9333ea" text-anchor="middle">→</text><circle cx="333" cy="42" r="28" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5"/><text x="333" y="52" font-size="26" text-anchor="middle">📖</text><text x="333" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Biografía</text><text x="333" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">fidelidad a uno mismo</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">Cómo se construye la identidad personal</p></div></div>`,
                reto: { pregunta: "¿Cómo influye el reconocimiento en nuestra identidad personal?", opciones: [{ texto: "No tiene relevancia; la identidad es totalmente independiente del entorno.", correcta: false }, { texto: "Es fundamental; la falta de reconocimiento puede distorsionar la imagen que tenemos de nosotros mismos.", correcta: true }] }
            },
            autoestima: {
                badge: "Tema 4 • Autoestima", icon: "💎", title: "Estructura de la Autoestima",
                img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&auto=format&fit=crop&q=80", caption: "Competencia y merecimiento.",
                content: `<p class="font-medium text-yellow-950">Basado en Chris Mruk:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Competencia:</strong> Componente conductual y observable relacionado con la eficacia en el manejo de los retos de la vida.</li><li><strong>Merecimiento:</strong> Juicio de valor ético vinculado a percibirnos como dignos de aprecio y valor positivo.</li><li><strong>Cualidad vivida:</strong> Integra procesos cognitivos (juicios y autoconciencia) y afectivos (emociones con poder motivacional).</li><li><strong>Dinámica:</strong> Es un estatus vital relativamente estable, pero permanentemente abierto al crecimiento y cambio.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#fef9c355;border:2px solid #eab30866"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="67" cy="42" r="28" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/><text x="67" y="52" font-size="26" text-anchor="middle">💪</text><text x="67" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Competencia</text><text x="67" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">eficacia</text><text x="133" y="50" font-size="22" font-weight="800" fill="#eab308" text-anchor="middle">+</text><circle cx="200" cy="42" r="28" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/><text x="200" y="52" font-size="26" text-anchor="middle">💝</text><text x="200" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Merecimiento</text><text x="200" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">valor propio</text><text x="267" y="50" font-size="22" font-weight="800" fill="#eab308" text-anchor="middle">=</text><circle cx="333" cy="42" r="28" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/><text x="333" y="52" font-size="26" text-anchor="middle">💎</text><text x="333" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Autoestima</text><text x="333" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">cualidad vivida</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">Dos componentes que dan forma a la autoestima</p></div></div>`,
                reto: { pregunta: "¿Qué dos componentes esenciales interactúan para conformar la autoestima?", opciones: [{ texto: "Competencia y merecimiento.", correcta: true }, { texto: "Fuerza física y popularidad social.", correcta: false }] }
            },
            personalidad: {
                badge: "Tema 5 • Personalidad", icon: "🧩", title: "Geografía de la Personalidad",
                img: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=800&auto=format&fit=crop&q=80", caption: "Carácter, temperamento y rasgos.",
                content: `<p class="font-medium text-emerald-950">Basado en psiquiatría y antropología:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Etimología:</strong> Procede de 'personare' (máscara del actor) y 'per se unum' (unidad sintética y original).</li><li><strong>Tetralogía:</strong> Integra elementos físicos, psicológicos, sociales y culturales.</li><li><strong>Carácter y Temperamento:</strong> El temperamento es heredado (raíz neurobiológica); el carácter se adquiere mediante la experiencia, los hábitos y la cultura.</li><li><strong>Rasgos y Estados:</strong> Los rasgos son disposiciones estables; los estados son características pasajeras y efímeras.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#d1fae555;border:2px solid #10b98166"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="67" cy="42" r="28" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/><text x="67" y="52" font-size="26" text-anchor="middle">🧬</text><text x="67" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Temperamento</text><text x="67" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">heredado</text><text x="133" y="50" font-size="22" font-weight="800" fill="#10b981" text-anchor="middle">+</text><circle cx="200" cy="42" r="28" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/><text x="200" y="52" font-size="26" text-anchor="middle">🌳</text><text x="200" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Carácter</text><text x="200" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">adquirido</text><text x="267" y="50" font-size="22" font-weight="800" fill="#10b981" text-anchor="middle">=</text><circle cx="333" cy="42" r="28" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/><text x="333" y="52" font-size="26" text-anchor="middle">🧩</text><text x="333" y="96" font-size="11" font-weight=             familia: {
                badge: "Tema 6 • Familia", icon: "🏡", title: "¿Por qué la Familia?",

                content: `<p class="font-medium text-orange-950">Basado en Tomás Melendo:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Excedencia en el ser:</strong> La necesidad de la familia no surge primariamente de la precariedad o debilidad humana, sino de su grandeza y valía.</li><li><strong>Un ser para el amor:</strong> Al ser humano "le sobra ser"; por ello, su operación más propia consiste en darse y amar sin medida.</li><li><strong>Aceptación incondicional:</strong> La familia genuina es el único ámbito natural donde se acoge a cada miembro por el mero hecho de ser persona, permitiéndole cumplirse.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#ffedd555;border:2px solid #f9731666"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="67" cy="42" r="28" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/><text x="67" y="52" font-size="26" text-anchor="middle">🎁</text><text x="67" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Darse</text><text x="67" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">"le sobra ser"</text><text x="133" y="50" font-size="22" font-weight="800" fill="#f97316" text-anchor="middle">→</text><circle cx="200" cy="42" r="28" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/><text x="200" y="52" font-size="26" text-anchor="middle">💞</text><text x="200" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Amar</text><text x="200" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">sin medida</text><text x="267" y="50" font-size="22" font-weight="800" fill="#f97316" text-anchor="middle">→</text><circle cx="333" cy="42" r="28" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/><text x="333" y="52" font-size="26" text-anchor="middle">🏡</text><text x="333" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Familia</text><text x="333" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">aceptación incondicional</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">La familia como ámbito natural del amor</p></div></div>`,

            },
            amistad: {
                badge: "Tema 7 • Amistad", icon: "🤝", title: "Pilares y Polillas",
                img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=800&auto=format&fit=crop&q=80", caption: "Benevolencia, confidencia y virtudes.",
                content: `<p class="font-medium text-rose-950">Basado en Ana María Romero Iribas:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Notas de la amistad:</strong> Desear el bien al amigo (benevolencia), hacerle el bien y compartir la intimidad mediante la confidencia.</li><li><strong>Pilares (Virtudes):</strong> Se cimenta sobre el respeto, la lealtad sincera, la generosidad, la disposición a perdonar y la apertura a otros.</li><li><strong>Polillas:</strong> Amenazas que erosionan la amistad, tales como la crítica destructiva, el egoísmo y el resentimiento.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#ffe4e655;border:2px solid #f43f5e66"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="100" cy="42" r="28" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2.5"/><text x="100" y="52" font-size="26" text-anchor="middle">🏛️</text><text x="100" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Pilares</text><text x="100" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">respeto · lealtad · perdón</text><text x="200" y="50" font-size="22" font-weight="800" fill="#f43f5e" text-anchor="middle">vs</text><circle cx="300" cy="42" r="28" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2.5"/><text x="300" y="52" font-size="26" text-anchor="middle">🦋</text><text x="300" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Polillas</text><text x="300" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">crítica · egoísmo · rencor</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">Lo que sostiene y lo que desgasta una amistad</p></div></div>`,
                reto: { pregunta: "¿Qué actitudes actúan como 'polillas' desgastando una buena amistad?", opciones: [{ texto: "La crítica destructiva a espaldas y el egoísmo centrado en uno mismo.", correcta: true }, { texto: "La escucha activa y el diálogo frecuente.", correcta: false }] }
            },
            redes: {
                badge: "Tema 8 • Redes Sociales", icon: "🌐", title: "Uso Responsable y Huella Digital",
                img: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=800&auto=format&fit=crop&q=80", caption: "Privacidad, ciberacoso y futuro.",
                content: `<p class="font-medium text-indigo-950">Directrices educativas esenciales:</p><ul class="list-disc pl-5 space-y-1.5"><li><strong>Privacidad y Datos:</strong> Proteger la información personal frente a publicaciones imprudentes que afecten la seguridad.</li><li><strong>Prevención del Ciberacoso:</strong> Identificar riesgos, guardar evidencias y buscar apoyo adulto ante situaciones de hostigamiento digital.</li><li><strong>Huella Digital:</strong> Todo lo publicado en internet perdura y conforma nuestra reputación a futuro.</li><li><strong>Límites y Relaciones:</strong> Equilibrar el tiempo de pantalla para priorizar el respeto, el diálogo y las relaciones sanas en el mundo real.</li></ul><div class="pt-1"><div class="rounded-2xl p-3 shadow-sm" style="background:#e0e7ff55;border:2px solid #6366f166"><svg viewBox="0 0 400 120" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif"><circle cx="50" cy="42" r="28" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="50" y="52" font-size="26" text-anchor="middle">🔒</text><text x="50" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Privacidad</text><text x="50" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">proteger datos</text><text x="100" y="50" font-size="22" font-weight="800" fill="#6366f1" text-anchor="middle">·</text><circle cx="150" cy="42" r="28" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="150" y="52" font-size="26" text-anchor="middle">🛡️</text><text x="150" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Ciberacoso</text><text x="150" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">evidencias y apoyo</text><text x="200" y="50" font-size="22" font-weight="800" fill="#6366f1" text-anchor="middle">·</text><circle cx="250" cy="42" r="28" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="250" y="52" font-size="26" text-anchor="middle">👣</text><text x="250" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Huella digital</text><text x="250" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">todo perdura</text><text x="300" y="50" font-size="22" font-weight="800" fill="#6366f1" text-anchor="middle">·</text><circle cx="350" cy="42" r="28" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="350" y="52" font-size="26" text-anchor="middle">⏱️</text><text x="350" y="96" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">Límites</text><text x="350" y="111" font-size="9.5" fill="#6b7280" text-anchor="middle">tiempo de pantalla</text></svg><p class="text-[11px] text-center text-gray-500 font-medium mt-1">Hábitos para un uso responsable de las redes</p></div></div>`,
                reto: { pregunta: "¿Por qué es crucial cuidar nuestra huella digital en internet?", opciones: [{ texto: "Porque las pantallas sustituyen por completo el trato humano.", correcta: false }, { texto: "Porque nuestras decisiones y publicaciones actuales influyen directamente en nuestro futuro personal y profesional.", correcta: true }] }
            }
        };

        function openModal(k) {
            const d = db[k];
            if(!d) return;
            document.getElementById('modal-badge').textContent = d.badge;
            document.getElementById('modal-icon').textContent = d.icon;
            document.getElementById('modal-title').textContent = d.title;
            document.getElementById('modal-hero-img').src = d.img;
            document.getElementById('modal-hero-caption').textContent = d.caption;
            document.getElementById('modal-content').innerHTML = d.content;
            document.getElementById('reto-pregunta').textContent = d.reto.pregunta;
            
            const ops = document.getElementById('reto-opciones');
            ops.innerHTML = '';
            const fb = document.getElementById('reto-feedback');
            fb.classList.add('hidden');

            d.reto.opciones.forEach(o => {
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 rounded-xl bg-white border border-amber-300 hover:bg-amber-100 text-amber-950 text-xs sm:text-sm font-medium transition shadow-sm cursor-pointer";
                b.textContent = o.texto;
                b.onclick = () => {
                    ops.querySelectorAll('button').forEach(x => x.disabled = true);
                    if(o.correcta) {
                        b.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-900');
                        fb.textContent = "¡Correcto! Excelente comprensión del concepto académico.";
                        fb.className = "mt-3 p-3 rounded-xl text-xs sm:text-sm font-medium bg-emerald-100 text-emerald-900 block";
                    } else {
                        b.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                        fb.textContent = "Incorrecto. Te invitamos a repasar los conceptos teóricos anteriores.";
                        fb.className = "mt-3 p-3 rounded-xl text-xs sm:text-sm font-medium bg-rose-100 text-rose-900 block";
                    }
                };
                ops.appendChild(b);
            });

            document.getElementById('modal-overlay').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('modal-container').classList.remove('scale-95');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('modal-container').classList.add('scale-95');
            document.body.style.overflow = 'auto';
        }
    </script>
